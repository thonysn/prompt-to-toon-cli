[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toon-cli"
version = "1.0.0"
description = "Convert any prompt or structured input into compact .toon format"
readme = "README.md"
license = { file = "LICENSE" }
license-expression = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "toon contributors" }]
keywords = ["toon", "cli", "llm", "token-optimization", "structured-output"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
toon = "src.cli.main:main"

[project.urls]
Homepage = "https://github.com/thonysn/prompt-to-toon-cli"
Documentation = "https://github.com/thonysn/prompt-to-toon-cli#readme"
Repository = "https://github.com/thonysn/prompt-to-toon-cli"
Issues = "https://github.com/thonysn/prompt-to-toon-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
